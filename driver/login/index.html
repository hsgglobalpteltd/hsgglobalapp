<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0F172A">
  <title>Outsource Driver Login - iB HSG Global</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <script>
    // Strict Mobile Only Check (Redirect to main QR fallback if accessed on desktop)
    if (window.innerWidth > 600) {
      window.location.href = '../../index.html';
    }
    window.addEventListener('resize', function() {
      if (window.innerWidth > 600) {
        window.location.href = '../../index.html';
      }
    });
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: #F8FAFC;
      color: #0F172A;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)) 20px;
    }

    .login-container {
      width: 100%;
      max-width: 390px;
      margin: auto auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .badge-header {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #0B57D0 0%, #0842A0 100%);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 8px 16px -4px rgba(11, 87, 208, 0.3);
    }

    .badge-header svg {
      width: 28px;
      height: 28px;
    }

    .login-title {
      font-size: 22px;
      font-weight: 850;
      color: #0F172A;
      margin-bottom: 4px;
      text-align: center;
      letter-spacing: -0.02em;
    }

    .login-subtitle {
      font-size: 13px;
      color: #64748B;
      font-weight: 500;
      text-align: center;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    .login-card {
      width: 100%;
      background: #FFFFFF;
      border-radius: 20px;
      border: 1px solid #E2E8F0;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
      padding: 24px 20px;
    }

    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 750;
      color: #334155;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .form-input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      font-size: 15px;
      font-weight: 600;
      color: #0F172A;
      background-color: #F8FAFC;
      border: 1.5px solid #CBD5E1;
      border-radius: 12px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      background-color: #FFFFFF;
      border-color: #0B57D0;
      box-shadow: 0 0 0 3px rgba(11, 87, 208, 0.12);
    }

    .form-input::placeholder {
      color: #94A3B8;
      font-weight: 400;
    }

    .submit-btn {
      width: 100%;
      height: 50px;
      background: #0B57D0;
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
      box-shadow: 0 4px 12px rgba(11, 87, 208, 0.25);
      transition: all 0.2s ease;
    }

    .submit-btn:active {
      transform: scale(0.98);
      background: #0842A0;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .footer-text {
      font-size: 11px;
      color: #94A3B8;
      text-align: center;
      margin-top: 16px;
    }

    /* Toast Notification */
    .toast-box {
      position: fixed;
      top: max(20px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background-color: #0F172A;
      color: #FFFFFF;
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      z-index: 99999;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      max-width: 90%;
      text-align: center;
    }

    .toast-box.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div id="toast" class="toast-box"></div>

  <div class="login-container">
    <div class="badge-header" style="background: transparent; box-shadow: none; width: auto; height: auto; margin-bottom: 12px;">
      <img src="../../logo.png" alt="Company Logo" style="height: 76px; max-width: 220px; object-fit: contain;" onerror="this.src='../icon.png'">
    </div>

    <h1 class="login-title">Outsource Driver Gate</h1>
    <p class="login-subtitle">Enter your driver and vehicle details to begin your delivery job.</p>

    <div class="login-card">
      <form id="outsource-login-form">
        <div class="form-group">
          <label class="form-label" for="driver-name">Driver Name</label>
          <input type="text" id="driver-name" class="form-input" placeholder="e.g. Anas" autocomplete="name" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="vehicle-plate">Vehicle Plate Number</label>
          <input type="text" id="vehicle-plate" class="form-input" placeholder="e.g. SBA 1234 A" style="text-transform: uppercase;" autocomplete="off" autocorrect="off" autocapitalize="characters" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="driver-phone">Mobile Phone Number</label>
          <div style="display: flex; gap: 8px; width: 100%;">
            <select id="country-code" style="height: 48px; padding: 0 10px; font-size: 15px; font-weight: 700; color: #0F172A; background-color: #F8FAFC; border: 1.5px solid #CBD5E1; border-radius: 12px; outline: none; cursor: pointer; flex-shrink: 0;">
              <option value="+65" selected>+65</option>
              <option value="+60">+60</option>
              <option value="+62">+62</option>
              <option value="+880">+880</option>
              <option value="+91">+91</option>
              <option value="+86">+86</option>
              <option value="+84">+84</option>
              <option value="+63">+63</option>
              <option value="+66">+66</option>
            </select>
            <input type="tel" id="driver-phone" class="form-input" placeholder="e.g. 9123 4567" autocomplete="tel" required style="flex: 1;" />
          </div>
        </div>

        <button type="submit" id="submit-btn" class="submit-btn" style="display: flex; align-items: center; justify-content: center; gap: 0;">
          <span>Enter Driver App</span>
        </button>
      </form>
    </div>

    <div class="footer-text">
      iB - HSG Global &bull; Internal Delivery Bridge
    </div>
  </div>

  <script>
    const WORKER_URL = 'https://ib-v2.hsgglobalpteltd.workers.dev';

    function showToast(msg, duration = 3000) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, duration);
    }

    // Auto-fill saved details if present
    window.addEventListener('DOMContentLoaded', () => {
      try {
        const saved = localStorage.getItem('outsource_details') || localStorage.getItem('saved_outsource_details');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed.name) document.getElementById('driver-name').value = parsed.name;
          if (parsed.plate) document.getElementById('vehicle-plate').value = parsed.plate;
          if (parsed.phone) {
            let rawPhone = parsed.phone;
            const codeEl = document.getElementById('country-code');
            const prefixes = ['+65', '+60', '+62', '+880', '+91', '+86', '+84', '+63', '+66'];
            const matchedPrefix = prefixes.find(p => rawPhone.startsWith(p));
            if (matchedPrefix && codeEl) {
              codeEl.value = matchedPrefix;
              rawPhone = rawPhone.substring(matchedPrefix.length).trim();
            }
            document.getElementById('driver-phone').value = rawPhone;
          }
        }
      } catch (_) {}
    });

    const form = document.getElementById('outsource-login-form');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('driver-name').value.trim();
      const plate = document.getElementById('vehicle-plate').value.trim().toUpperCase();
      const countryCode = document.getElementById('country-code')?.value || '+65';
      const rawPhone = document.getElementById('driver-phone').value.trim();

      if (!name || !plate || !rawPhone) {
        showToast('Please fill in all fields.');
        return;
      }

      // Format full international phone number: e.g. +65 91234567 or +6591234567
      const cleanPhoneDigits = rawPhone.replace(/^\+?[0-9]{1,4}/, '').trim() || rawPhone;
      const fullPhone = `${countryCode} ${rawPhone.replace(/^\+?[0-9]{1,4}\s*/, '').trim() || rawPhone}`;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Entering...</span>';

      const combinedDriverName = `${name} | ${plate} (${fullPhone})`;

      // 1. Clear any conflicting in-house session
      localStorage.removeItem('ib_auth_user');
      localStorage.removeItem('ib_session_expiry');

      // 2. Set Outsource Driver Session
      localStorage.setItem('is_outsource', 'true');
      localStorage.setItem('auth_driver_name', combinedDriverName);
      localStorage.setItem('outsource_details', JSON.stringify({ name, plate, phone: fullPhone }));
      localStorage.setItem('saved_outsource_details', JSON.stringify({ name, plate, phone: fullPhone }));
      localStorage.setItem('auth_timestamp', Date.now().toString());
      sessionStorage.setItem('from_pools', 'true');

      // 3. Register outsource session on backend
      try {
        const res = await fetch(`${WORKER_URL}/api/app-auth/outsource-session`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, plate, phone: fullPhone })
        });
        const data = await res.json();
        if (data && data.session_id) {
          localStorage.setItem('ib_os_session_id', data.session_id);
        }
      } catch (err) {
        console.warn('Backend session registration warning:', err);
      }

      showToast('Logged in successfully!');
      setTimeout(() => {
        window.location.replace('../index.html');
      }, 300);
    });
  </script>
</body>
</html>
